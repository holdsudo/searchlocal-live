name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  indexnow:
    # Tells Bing, Yandex, Seznam, Naver and Yep about pages whose content changed today
    # (sitemap lastmod is content-based, so unchanged pages are not resubmitted).
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Submit changed URLs
        env:
          KEY: b8a6e1967596eec38c7645b850123d99
        run: |
          sleep 30
          TODAY=$(date -u +%F)
          URLS=$(curl -fsSL https://searchlocal.live/sitemap.xml | grep -o "<loc>[^<]*</loc><lastmod>$TODAY" | sed -E 's#<loc>([^<]*)</loc>.*#"\1"#' | paste -sd, -)
          if [ -z "$URLS" ]; then echo "No changed URLs today"; exit 0; fi
          echo "Submitting: $URLS"
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"searchlocal.live\",\"key\":\"$KEY\",\"keyLocation\":\"https://searchlocal.live/$KEY.txt\",\"urlList\":[$URLS]}"
